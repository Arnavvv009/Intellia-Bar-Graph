<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e205e"/>
      <stop offset="100%" stop-color="#1b103c"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" fill="url(#sky1)"/>
  <!-- floor -->
  <rect x="0" y="330" width="1000" height="70" fill="#0e0724"/>
  <ellipse cx="500" cy="330" rx="520" ry="18" fill="#ffffff" opacity="0.03"/>

  <!-- confetti dots -->
  <g opacity="0.5">
    <circle cx="80" cy="60" r="5" fill="#ffbe1a"/>
    <circle cx="150" cy="110" r="4" fill="#34d399"/>
    <circle cx="900" cy="70" r="5" fill="#a78bfa"/>
    <circle cx="940" cy="150" r="4" fill="#ff8a50"/>
    <circle cx="60" cy="200" r="3" fill="#ffffff"/>
  </g>

  <!-- Clipboard / tally sheet -->
  <g transform="translate(360,90)">
    <rect x="0" y="0" width="280" height="220" rx="14" fill="#f5f0ff" stroke="#e6a200" stroke-width="4"/>
    <rect x="100" y="-14" width="80" height="26" rx="8" fill="#e6a200"/>
    <text x="140" y="40" text-anchor="middle" font-family="Nunito, sans-serif" font-size="20" font-weight="800" fill="#2e205e">Favourite Fruit</text>
    <line x1="20" y1="55" x2="260" y2="55" stroke="#c9b8ee" stroke-width="2"/>

    <!-- rows -->
    <g font-family="Nunito, sans-serif" font-size="16" font-weight="700" fill="#4a3b7a">
      <text x="24" y="85">🥭 Mango</text>
      <text x="24" y="120">🍎 Apple</text>
      <text x="24" y="155">🍇 Grapes</text>
      <text x="24" y="190">🍌 Banana</text>
    </g>
    <!-- tally marks -->
    <g stroke="#e6a200" stroke-width="3" stroke-linecap="round">
      <line x1="150" y1="78" x2="150" y2="92"/><line x1="158" y1="78" x2="158" y2="92"/><line x1="166" y1="78" x2="166" y2="92"/>
      <line x1="150" y1="113" x2="150" y2="127"/><line x1="158" y1="113" x2="158" y2="127"/>
      <line x1="150" y1="148" x2="150" y2="162"/>
      <line x1="150" y1="183" x2="150" y2="197"/><line x1="158" y1="183" x2="158" y2="197"/><line x1="166" y1="183" x2="166" y2="197"/><line x1="174" y1="183" x2="174" y2="197"/>
    </g>
  </g>

  <!-- Robo robot on the left, pointing -->
  <g transform="translate(120,150)">
    <rect x="-4" y="-40" width="10" height="18" fill="#4d3b84" rx="4"/>
    <circle cx="1" cy="-42" r="7" fill="#ffbe1a"/>
    <rect x="-6" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="72" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="-20" y="-22" width="90" height="90" rx="20" fill="#2d1c69" stroke="#4d3b84" stroke-width="5"/>
    <rect x="-8" y="-10" width="66" height="66" rx="12" fill="#1b103c"/>
    <circle cx="10" cy="18" r="7" fill="#00f3ff"/>
    <circle cx="42" cy="18" r="7" fill="#00f3ff"/>
    <path d="M8 40 Q25 52 42 40" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- arm pointing at clipboard -->
    <rect x="66" y="10" width="70" height="14" rx="7" fill="#2d1c69" transform="rotate(-18 66 10)"/>
    <circle cx="150" cy="-15" r="10" fill="#ffbe1a"/>
    <!-- legs -->
    <rect x="0" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
    <rect x="40" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
  </g>

  <!-- Two kids raising hands on the right -->
  <g transform="translate(700,140)">
    <circle cx="0" cy="0" r="26" fill="#ffd6a5"/>
    <path d="M-26 -6 Q0 -46 26 -6" fill="#5c3b1e"/>
    <rect x="-20" y="24" width="40" height="60" rx="14" fill="#4a90d9"/>
    <rect x="-34" y="-6" width="14" height="46" rx="7" fill="#ffd6a5" transform="rotate(-30 -34 -6)"/>
    <circle cx="-2" cy="-2" r="3" fill="#2e205e"/><circle cx="10" cy="-2" r="3" fill="#2e205e"/>
    <path d="M-4 10 Q4 15 10 10" stroke="#2e205e" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(800,160)">
    <circle cx="0" cy="0" r="24" fill="#e8b48a"/>
    <path d="M-24 -10 Q0 -40 24 -10 Q24 -30 0 -34 Q-24 -30 -24 -10" fill="#2b1810"/>
    <rect x="-18" y="22" width="36" height="56" rx="12" fill="#ff8a50"/>
    <rect x="18" y="-4" width="13" height="42" rx="6" fill="#e8b48a" transform="rotate(28 18 -4)"/>
    <circle cx="-4" cy="-2" r="3" fill="#2e205e"/><circle cx="8" cy="-2" r="3" fill="#2e205e"/>
    <path d="M-4 10 Q2 14 8 10" stroke="#2e205e" stroke-width="2" fill="none"/>
  </g>
</svg>
