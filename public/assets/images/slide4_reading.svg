    <text x="230" y="26" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#ffbe1a">Favourite Fruit Graph</text>

    <line x1="70" y1="46" x2="70" y2="260" stroke="#ffffff" stroke-width="3"/>
    <line x1="70" y1="260" x2="420" y2="260" stroke="#ffffff" stroke-width="3"/>
    <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5">
      <line x1="65" y1="218" x2="420" y2="218"/><line x1="65" y1="176" x2="420" y2="176"/>
      <line x1="65" y1="134" x2="420" y2="134"/><line x1="65" y1="92" x2="420" y2="92"/><line x1="65" y1="50" x2="420" y2="50"/>
    </g>
    <g font-family="Inter, sans-serif" font-size="11" fill="#bca8f2" text-anchor="end">
      <text x="60" y="264">0</text><text x="60" y="222">2</text><text x="60" y="180">4</text>
      <text x="60" y="138">6</text><text x="60" y="96">8</text><text x="60" y="54">10</text>
    </g>

    <rect x="90" y="92" width="44" height="168" fill="#ffbe1a" rx="4"/>
    <rect x="148" y="134" width="44" height="126" fill="#ff8a50" rx="4"/>
    <rect x="206" y="176" width="44" height="84" fill="#a78bfa" rx="4"/>
    <rect x="264" y="50" width="44" height="210" fill="#34d399" rx="4"/>
    <rect x="322" y="218" width="44" height="42" fill="#4a90d9" rx="4"/>

    <!-- highlight ring around tallest bar -->
    <rect x="260" y="44" width="52" height="222" rx="8" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="286" y="34" text-anchor="middle" font-size="18">⭐</text>

    <g font-family="Nunito, sans-serif" font-size="10.5" font-weight="700" fill="#bca8f2" text-anchor="middle">
      <text x="112" y="276">Mango</text>
      <text x="170" y="276">Apple</text>
      <text x="228" y="276">Grapes</text>
      <text x="286" y="276">Banana</text>
      <text x="344" y="276">Papaya</text>
    </g>
  </g>

  <!-- Robo celebrating, pointing at tallest bar -->
  <g transform="translate(140,170)">
    <rect x="-4" y="-40" width="10" height="18" fill="#4d3b84" rx="4"/>
    <circle cx="1" cy="-42" r="7" fill="#ffbe1a"/>
    <rect x="-6" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="72" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="-20" y="-22" width="90" height="90" rx="20" fill="#2d1c69" stroke="#4d3b84" stroke-width="5"/>
    <rect x="-8" y="-10" width="66" height="66" rx="12" fill="#1b103c"/>
    <path d="M4 16 L12 8 M4 8 L12 16" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 16 L44 8 M36 8 L44 16" stroke="#00f3ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 34 Q25 48 42 34" fill="#ffbe1a" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
    <rect x="40" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
    <rect x="66" y="10" width="80" height="14" rx="7" fill="#2d1c69" transform="rotate(-14 66 10)"/>
  </g>

  <g opacity="0.6">
    <circle cx="900" cy="70" r="5" fill="#ffbe1a"/>
    <circle cx="940" cy="130" r="4" fill="#a78bfa"/>
    <circle cx="80" cy="60" r="3" fill="#34d399"/>
    <circle cx="60" cy="250" r="4" fill="#ff8a50"/>
