<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e205e"/>
      <stop offset="100%" stop-color="#1b103c"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" fill="url(#sky2)"/>
  <rect x="0" y="330" width="1000" height="70" fill="#0e0724"/>

  <!-- graph paper board -->
  <g transform="translate(330,50)">
    <rect x="0" y="0" width="430" height="290" rx="16" fill="#0e0724" stroke="#4d3b84" stroke-width="4"/>
    <!-- title banner -->
    <rect x="90" y="-16" width="250" height="34" rx="10" fill="#ffbe1a"/>
    <text x="215" y="6" text-anchor="middle" font-family="Nunito, sans-serif" font-size="16" font-weight="900" fill="#2e205e">Favourite Fruit Graph</text>

    <!-- y axis -->
    <line x1="60" y1="20" x2="60" y2="250" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <polygon points="60,14 52,30 68,30" fill="#ffffff"/>
    <!-- x axis -->
    <line x1="60" y1="250" x2="400" y2="250" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <polygon points="406,250 390,242 390,258" fill="#ffffff"/>

    <!-- scale ticks -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="2">
      <line x1="55" y1="210" x2="400" y2="210" stroke-dasharray="3 5"/>
      <line x1="55" y1="170" x2="400" y2="170" stroke-dasharray="3 5"/>
      <line x1="55" y1="130" x2="400" y2="130" stroke-dasharray="3 5"/>
      <line x1="55" y1="90" x2="400" y2="90" stroke-dasharray="3 5"/>
      <line x1="55" y1="50" x2="400" y2="50" stroke-dasharray="3 5"/>
    </g>
    <g font-family="Inter, sans-serif" font-size="12" fill="#bca8f2" text-anchor="end">
      <text x="48" y="254">0</text>
      <text x="48" y="214">2</text>
      <text x="48" y="174">4</text>
      <text x="48" y="134">6</text>
      <text x="48" y="94">8</text>
      <text x="48" y="54">10</text>
    </g>

    <text x="20" y="140" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#bca8f2" transform="rotate(-90 20 140)">Students</text>
    <text x="230" y="278" text-anchor="middle" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#bca8f2">Fruit</text>
  </g>

  <!-- Robo drawing with a giant ruler/pencil -->
  <g transform="translate(150,180)">
    <rect x="-4" y="-40" width="10" height="18" fill="#4d3b84" rx="4"/>
    <circle cx="1" cy="-42" r="7" fill="#ffbe1a"/>
    <rect x="-6" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="72" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="-20" y="-22" width="90" height="90" rx="20" fill="#2d1c69" stroke="#4d3b84" stroke-width="5"/>
    <rect x="-8" y="-10" width="66" height="66" rx="12" fill="#1b103c"/>
    <line x1="6" y1="14" x2="16" y2="22" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="38" cy="18" r="4" fill="#00f3ff"/>
    <line x1="8" y1="40" x2="36" y2="40" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <rect x="0" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
    <rect x="40" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
    <!-- pencil in hand -->
    <g transform="translate(70,-10) rotate(35)">
      <rect x="0" y="0" width="90" height="16" rx="4" fill="#ffbe1a"/>
      <polygon points="90,0 110,8 90,16" fill="#e6a200"/>
      <rect x="0" y="0" width="14" height="16" fill="#ff8a50"/>
    </g>
  </g>

  <g opacity="0.5">
    <circle cx="900" cy="80" r="5" fill="#34d399"/>
    <circle cx="940" cy="150" r="4" fill="#ff8a50"/>
    <circle cx="60" cy="70" r="3" fill="#ffffff"/>
  </g>
</svg>
