<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e205e"/>
      <stop offset="100%" stop-color="#1b103c"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" fill="url(#sky3)"/>
  <rect x="0" y="330" width="1000" height="70" fill="#0e0724"/>

  <g transform="translate(280,40)">
    <rect x="0" y="0" width="480" height="300" rx="16" fill="#0e0724" stroke="#4d3b84" stroke-width="4"/>
    <text x="240" y="26" text-anchor="middle" font-family="Nunito, sans-serif" font-size="15" font-weight="900" fill="#ffbe1a">Favourite Fruit Graph</text>

    <line x1="70" y1="46" x2="70" y2="260" stroke="#ffffff" stroke-width="3"/>
    <line x1="70" y1="260" x2="440" y2="260" stroke="#ffffff" stroke-width="3"/>

    <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5">
      <line x1="65" y1="218" x2="440" y2="218"/>
      <line x1="65" y1="176" x2="440" y2="176"/>
      <line x1="65" y1="134" x2="440" y2="134"/>
      <line x1="65" y1="92" x2="440" y2="92"/>
      <line x1="65" y1="50" x2="440" y2="50"/>
    </g>
    <g font-family="Inter, sans-serif" font-size="11" fill="#bca8f2" text-anchor="end">
      <text x="60" y="264">0</text><text x="60" y="222">2</text><text x="60" y="180">4</text>
      <text x="60" y="138">6</text><text x="60" y="96">8</text><text x="60" y="54">10</text>
    </g>

    <!-- Bars being built, one mid-construction with a measuring guide -->
    <g>
      <rect x="90" y="92" width="46" height="168" fill="#ffbe1a" rx="4"/>
      <rect x="150" y="134" width="46" height="126" fill="#ff8a50" rx="4"/>
      <rect x="210" y="176" width="46" height="84" fill="#a78bfa" rx="4"/>
      <!-- bar under construction, dashed outline above current fill -->
      <rect x="270" y="260" width="46" height="0" fill="#34d399" rx="4"/>
      <rect x="270" y="50" width="46" height="210" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" rx="4"/>
      <rect x="270" y="176" width="46" height="84" fill="#34d399" rx="4"/>
      <rect x="330" y="218" width="46" height="42" fill="#4a90d9" rx="4"/>
    </g>
    <g font-family="Nunito, sans-serif" font-size="11" font-weight="700" fill="#bca8f2" text-anchor="middle">
      <text x="113" y="276">Mango</text>
      <text x="173" y="276">Apple</text>
      <text x="233" y="276">Grapes</text>
      <text x="293" y="276">Banana</text>
      <text x="353" y="276">Papaya</text>
    </g>
  </g>

  <!-- Robo with a level/measuring tool checking bar height -->
  <g transform="translate(140,190)">
    <rect x="-4" y="-40" width="10" height="18" fill="#4d3b84" rx="4"/>
    <circle cx="1" cy="-42" r="7" fill="#ffbe1a"/>
    <rect x="-6" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="72" y="46" width="10" height="28" fill="#ff8a50" rx="4"/>
    <rect x="-20" y="-22" width="90" height="90" rx="20" fill="#2d1c69" stroke="#4d3b84" stroke-width="5"/>
    <rect x="-8" y="-10" width="66" height="66" rx="12" fill="#1b103c"/>
    <path d="M10 14 L18 22 L30 8" stroke="#00f3ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="18" r="4" fill="#00f3ff"/>
    <path d="M8 40 Q25 50 42 40" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="0" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
    <rect x="40" y="68" width="16" height="30" rx="6" fill="#4d3b84"/>
  </g>

  <g opacity="0.5">
    <circle cx="900" cy="90" r="5" fill="#34d399"/>
    <circle cx="60" cy="80" r="3" fill="#ffffff"/>
  </g>
</svg>
